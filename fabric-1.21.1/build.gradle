plugins {
    id 'fabric-loom' version '1.10-SNAPSHOT'
    id 'maven-publish'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

repositories {
    // Vanilla Fabric only. Outpost Pacifier is server-side, zero
    // dependency — no external libs, no host-mod. The spawn-cancel
    // uses a small Mixin on PathfinderMob#checkSpawnRules (Fabric has
    // no first-class FinalizeSpawn event, and cancelling
    // Mob#finalizeSpawn alone doesn't stop plain-vanilla Fabric from
    // adding the mob — see MobFinalizeSpawnMixin's javadoc).
    // mavenCentral() added only to resolve the JUnit test dependencies
    // below — the loom-managed coordinates above (minecraft, mappings,
    // fabric-loader, fabric-api) already resolve via Loom's own
    // injected repos and don't need it.
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // Mojang official mappings: same net.minecraft.* names as Forge/NeoForge,
    // so the loader-agnostic logic copies verbatim.
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": minecraft_version,
                "loader_version": loader_version,
                "fabric_version": fabric_version,
                "mod_id": mod_id,
                "mod_name": mod_name,
                "mod_description": mod_description,
                "mod_authors": mod_authors,
                "mod_license": mod_license
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// Mixin AP の strict mode 無効化 (vanilla method の解決を skip)
loom {
    mixin {
        useLegacyMixinAp = false
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${mod_id}" }
    }
}
