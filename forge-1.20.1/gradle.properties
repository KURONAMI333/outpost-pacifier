# Outpost Pacifier - Forge 1.20.1 build
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# 1.20.1 = Java 17. System JAVA_HOME is JDK 25 (too new for ForgeGradle) — pin JDK 17.
org.gradle.java.home=C:/Program Files/Java/jdk-17

# ─── Minecraft / Forge ──────────────────────────────────────────
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.13
forge_version_range=[47,)
loader_version_range=[47,)

# ─── Parchment ─────────────────────────────────────────────────
parchment_minecraft_version=1.20.1
parchment_mappings_version=2023.09.03

# ─── Mod metadata ──────────────────────────────────────────────
mod_id=outpostpacifier
mod_name=Outpost Pacifier
mod_license=MIT
mod_version=0.1.0
mod_group_id=com.kuronami.outpostpacifier
mod_authors=KURONAMI
mod_description=Found the perfect base spot but a pillager outpost (or anything) keeps respawning hostiles next to it? Stand there, run /pacify, and natural hostile spawns stop in that zone — permanently, persisted across restarts. /unpacify undoes it, /pacify list shows your zones. Does NOT remove existing mobs or change anything else; only blocks new natural hostile spawns inside zones you choose. Server-side, op-only, no dependencies, 9 languages.
