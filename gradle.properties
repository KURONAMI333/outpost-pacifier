mod_description=Found the perfect base spot but a pillager outpost (or anything) keeps respawning hostiles next to it? Stand there, run /pacify, and natural hostile spawns stop in that zone — permanently, persisted across restarts. /unpacify undoes it, /pacify list shows your zones. Does NOT remove existing mobs or change anything else; only blocks new natural hostile spawns inside zones you choose. Server-side, op-only, no dependencies, 9 languages.
